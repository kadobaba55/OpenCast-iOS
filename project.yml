name: OpenCast
options:
  bundleIdPrefix: com.opencast
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    TARGETED_DEVICE_FAMILY: "1,2" # iPhone & iPad

targets:
  OpenCast:
    type: application
    platform: iOS
    sources:
      - path: OpenCast
      - path: OpenCastBroadcast/StreamServer.swift
      - path: OpenCastBroadcast/WebViewerTemplate.swift
    info:
      path: OpenCast/Info.plist
      properties:
        CFBundleDisplayName: "OpenCast"
        CFBundleIdentifier: "com.opencast.app"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: "OpenCast yerel ağınızdaki televizyonları bulmak ve ekranınızı yansıtmak için yerel ağ iznine ihtiyaç duyar."
        NSBonjourServices:
          - "_http._tcp"
          - "_opencast._tcp"
    dependencies:
      - target: OpenCastBroadcast

  OpenCastBroadcast:
    type: app-extension
    platform: iOS
    sources:
      - path: OpenCastBroadcast
    info:
      path: OpenCastBroadcast/Info.plist
      properties:
        CFBundleDisplayName: "OpenCast Ekran Yayını"
        CFBundleIdentifier: "com.opencast.app.broadcast"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSLocalNetworkUsageDescription: "OpenCast ekranınızı yerel ağa aktarmak için yerel ağ iznine ihtiyaç duyar."
        NSExtension:
          NSExtensionPointIdentifier: "com.apple.broadcast-services-upload"
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).SampleHandler"
          RPBroadcastProcessMode: "RPBroadcastProcessModeSampleBuffer"
