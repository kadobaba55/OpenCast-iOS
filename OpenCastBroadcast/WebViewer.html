<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>OpenCast - TV Ekran Yansıtıcı</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #stream-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
    }

    #stream-img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      box-shadow: 0 0 50px rgba(0, 0, 0, 0.8);
      transition: opacity 0.3s ease;
    }

    /* Durum ve Kontrol Çubuğu (Kumandayla uyumlu) */
    #overlay-bar {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(18, 18, 18, 0.85);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 10px 24px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 14px;
      z-index: 100;
      opacity: 0.9;
      transition: opacity 0.5s ease;
    }

    #overlay-bar.autohide {
      opacity: 0;
      pointer-events: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
      animation: pulse 2s infinite;
    }

    .btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover, .btn:focus {
      background: #1d4ed8;
      transform: scale(1.05);
      outline: 2px solid #60a5fa;
    }

    #loading-state {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      color: #a1a1aa;
      font-size: 16px;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <div id="stream-container">
    <div id="loading-state">
      <div class="spinner"></div>
      <div>iPhone 13 bekleniyor... Yayını başlatın</div>
    </div>
    <img id="stream-img" src="/stream" alt="Canlı Ekran Yayını" style="display: none;" />
  </div>

  <div id="overlay-bar">
    <div class="badge">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Bağlandı</span>
    </div>
    <span style="color: #52525b;">|</span>
    <span id="res-text">1080p Full HD</span>
    <button class="btn" id="fullscreen-btn" tabindex="1">Tam Ekran Yap (OK Tuşu)</button>
  </div>

  <script>
    const streamImg = document.getElementById('stream-img');
    const loadingState = document.getElementById('loading-state');
    const overlayBar = document.getElementById('overlay-bar');
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    const statusText = document.getElementById('status-text');
    const statusDot = document.getElementById('status-dot');

    let hideTimer = null;

    function resetHideTimer() {
      overlayBar.classList.remove('autohide');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        overlayBar.classList.add('autohide');
      }, 3500);
    }

    document.addEventListener('mousemove', resetHideTimer);
    document.addEventListener('keydown', (e) => {
      resetHideTimer();
      // TV Kumandasında OK (Enter) tuşuna basıldığında tam ekran yap
      if (e.key === 'Enter' || e.keyCode === 13) {
        toggleFullscreen();
      }
    });

    streamImg.onload = function() {
      loadingState.style.display = 'none';
      streamImg.style.display = 'block';
      statusText.innerText = 'Canlı Yayın';
      statusDot.style.background = '#22c55e';
      resetHideTimer();
    };

    streamImg.onerror = function() {
      loadingState.style.display = 'flex';
      streamImg.style.display = 'none';
      statusText.innerText = 'Yayın Bekleniyor';
      statusDot.style.background = '#eab308';
      // TV Tarayıcılarında kesinti olursa 1.5 sn sonra yeniden bağlanmayı dene
      setTimeout(() => {
        streamImg.src = '/stream?t=' + Date.now();
      }, 1500);
    };

    function toggleFullscreen() {
      const doc = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (doc.requestFullscreen) {
          doc.requestFullscreen();
        } else if (doc.webkitRequestFullscreen) {
          doc.webkitRequestFullscreen();
        }
        fullscreenBtn.innerText = 'Tam Ekrandan Çık';
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
        fullscreenBtn.innerText = 'Tam Ekran Yap (OK)';
      }
    }

    fullscreenBtn.addEventListener('click', toggleFullscreen);

    // İlk açılışta odağı butona ver ki Vestel kumandasıyla OK'a basılabilsin
    fullscreenBtn.focus();
    resetHideTimer();
  </script>
</body>
</html>
